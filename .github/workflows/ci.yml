name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A release published on github.com creates its tag there, which may not
  # start the tag push above: build and attach the AAR in that case too.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  KOTLIN_VERSION: "1.7.21"
  KOTLINC_SHA256: 8412b31b808755f0c0d336dbb8c8443fa239bf32ddb3cdb81b305b25f0ad279e
  JNA_VERSION: "5.14.0"
  JNA_SHA256: 34ed1e1f27fa896bca50dbc4e99cf3732967cec387a7a0d5e3486c09673fe8c6
  NDK_PACKAGE: "ndk;27.2.12479018"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  # The SOMBE app builds with Kotlin 1.7.21: the generated bindings must compile
  # with exactly that compiler, and work against the optimized library.
  kotlin-1-7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build library and generate bindings
        run: |
          rustup show
          cargo build --locked
          cargo build --locked --release
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate \
            --library target/debug/libsombe_chat_crypto.so --language kotlin --no-format --out-dir bindings
      - name: Download kotlinc and JNA (checksums pinned)
        run: |
          curl -sSfL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          echo "$KOTLINC_SHA256  kotlinc.zip" | sha256sum -c
          unzip -q kotlinc.zip
          curl -sSfL -o jna.jar "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          echo "$JNA_SHA256  jna.jar" | sha256sum -c
      - name: Compile with Kotlin 1.7.21 and run
        run: |
          kotlinc/bin/kotlinc -Werror -cp jna.jar bindings/org/sombe/chatcrypto/sombe_chat_crypto.kt kotlin-check/Smoke.kt -d smoke.jar
          java -Djna.library.path=target/release -cp smoke.jar:jna.jar:kotlinc/lib/kotlin-stdlib.jar SmokeKt

  aar:
    needs: [rust, kotlin-1-7]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ${{ env.NDK_PACKAGE }}"
      - name: Rust targets and cargo-ndk
        run: |
          rustup show
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - name: Native libraries (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_PACKAGE#ndk;}"
          cargo ndk --platform 23 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/chatcrypto/src/main/jniLibs build --locked --release
          ls -la android/chatcrypto/src/main/jniLibs/*
      - name: Kotlin bindings
        run: |
          cargo build --locked
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate \
            --library target/debug/libsombe_chat_crypto.so --language kotlin --no-format \
            --out-dir android/chatcrypto/src/main/java
      - name: Build AAR and its SHA-256
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF does not match Cargo.toml version $version." >&2
            exit 1
          fi
          (cd android && bash gradlew --no-daemon :chatcrypto:assembleRelease)
          mkdir -p dist
          cp android/chatcrypto/build/outputs/aar/chatcrypto-release.aar "dist/sombe-chat-crypto-$version.aar"
          (cd dist && sha256sum "sombe-chat-crypto-$version.aar" > "sombe-chat-crypto-$version.aar.sha256")
          cat dist/*.sha256
          unzip -l dist/*.aar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sombe-chat-crypto-aar
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: aar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sombe-chat-crypto-aar
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c *.sha256
          notes="Android AAR (arm64-v8a, armeabi-v7a, x86_64) built from $GITHUB_SHA. SHA-256: $(cut -d' ' -f1 *.sha256)"
          # The release may already exist when someone published it by hand on
          # github.com: then attach the files to it instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.aar ./*.sha256
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "$notes" ./*.aar ./*.sha256
          fi
