[package]
name = "sombe-chat-crypto"
version = "0.10.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "End-to-end encryption layer for SOMBE ChatPay, built on vodozemac (Olm)."
repository = "https://github.com/sombeProject/sombe-chat-crypto"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "sombe_chat_crypto"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "make-vectors"
path = "tools/make_vectors.rs"
required-features = ["vectors"]

[features]
bindgen = ["uniffi/cli"]
# Fixed keys and fixed randomness for tools/make_vectors.rs and its tests only. Never in a
# build of the app.
vectors = []

[dependencies]
# libolm-compat is off: SOMBE never imports libolm pickles.
vodozemac = { version = "=0.11.2", default-features = false, features = ["precomputed-tables"] }
uniffi = "=0.32.2"
bs58 = "0.5.1"
serde = { version = "1", features = ["derive"] }
# preserve_order: the content JSON keeps its fields in the order PROTOCOL.md gives.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# The account key (0.7.0): HKDF from the wallet key, sealed with XChaCha20-Poly1305.
hkdf = "=0.13.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
# The sealed sender (0.10.0): HPKE (RFC 9180), base mode, DHKEM(X25519, HKDF-SHA256),
# HKDF-SHA256, ChaCha20Poly1305. Only that suite: no ML-KEM, no system randomness inside.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand_core = "=0.10.1"
thiserror = "2"
zeroize = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
